<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Studio Pro | Web Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --bg: #F4F7F9;
            --surface: #FFFFFF;
            --text-main: #111B21;
            --text-muted: #64748B;
            --border: #E2E8F0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); display: flex; flex-direction: column; height: 100vh; padding: 16px; color: var(--text-main); overflow-x: hidden; }

        /* Header */
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-top: 8px; }
        .title { flex: 1; text-align: center; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; color: var(--primary); }
        .reset-btn { background: #EEF2FF; color: var(--primary); border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; display: none; }

        /* Segmented Tabs (Scrollable for more features) */
        .tabs-container { overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tabs { display: flex; background: #E2E8F0; border-radius: 14px; padding: 4px; width: max-content; min-width: 100%; box-shadow: inset 0 2px 4px rgba(0,0,0,0.04); }
        .tab { padding: 12px 20px; text-align: center; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 10px; transition: all 0.3s ease; white-space: nowrap; }
        .tab.active { background: var(--surface); color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

        /* Main Card */
        .card { background: var(--surface); padding: 20px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; border: 1px solid rgba(226, 232, 240, 0.6); }

        /* Upload Area */
        .preview-box { width: 100%; height: 280px; background: #F8FAFC; border: 2px dashed #CBD5E1; border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; margin-bottom: 20px; position: relative; cursor: pointer; transition: 0.2s; }
        .preview-box:hover { background: #F1F5F9; border-color: var(--primary); }
        .preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; border-radius: 12px; transition: transform 0.3s ease, filter 0.3s ease; }
        .upload-placeholder { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); gap: 10px; }
        .upload-placeholder svg { width: 48px; height: 48px; color: #94A3B8; }
        .file-input { display: none; }

        /* Controls Section */
        .controls-section { width: 100%; display: none; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        
        .info-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 15px; }
        .info-original { color: var(--text-muted); }
        .info-estimated { color: var(--primary); background: #EEF2FF; padding: 4px 10px; border-radius: 20px; }

        /* Sliders & Tools */
        .tool-group { margin-bottom: 20px; }
        .tool-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 12px; }
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 8px; background: #E2E8F0; border-radius: 5px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--primary); cursor: pointer; border: 2px solid white; box-shadow: 0 2px 6px rgba(79, 70, 229, 0.4); }

        /* Select Dropdown */
        select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #CBD5E1; background: #F8FAFC; font-weight: 600; color: var(--text-main); outline: none; margin-bottom: 15px; }

        /* Filter Buttons */
        .filter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .filter-btn { padding: 10px; border: 1px solid #CBD5E1; background: white; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; transition: 0.2s; color: var(--text-muted); }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.back-arrow-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background: #475569;
        border: 4px solid #fff;
        color: #fff;
        padding: 10px 15px;
        font-family: 'Press Start 2P', monospace;
        font-size: 16px;
        cursor: pointer;
        z-index: 100;
        box-shadow: inset -4px -4px 0px rgba(0,0,0,0.4), inset 4px 4px 0px rgba(255,255,255,0.2), 4px 4px 0px #000;
        transition: transform 0.1s, box-shadow 0.1s;
    }
    .back-arrow-btn:active {
        transform: translate(4px, 4px);
        box-shadow: inset -2px -2px 0px rgba(0,0,0,0.4), inset 2px 2px 0px rgba(255,255,255,0.2), 0px 0px 0px #000;
    }
        /* Smart Button */
        .btn { width: 100%; padding: 16px; color: white; border: none; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; background: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
        .btn:active { transform: scale(0.97); background: var(--primary-hover); }
        .btn:disabled { opacity: 0.6; pointer-events: none; }
        .btn.success { background: var(--success); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }

        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<button class="back-arrow-btn" onclick="if(window.AppInventor){window.AppInventor.setWebViewString('Back_to_Arena');}else{console.log('Back_to_Arena');}">⬅</button>
    <div class="header">
        <div style="width:60px;"></div>
        <div class="title">Photo Studio Web</div>
        <button class="reset-btn" id="resetBtn" onclick="resetStudio()">New</button>
    </div>

    <div class="tabs-container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('compressor')" id="tab-compressor">Compress</div>
            <div class="tab" onclick="switchTab('edit')" id="tab-edit">Edit & Filters</div>
            <div class="tab" onclick="switchTab('passport')" id="tab-passport">Passport</div>
        </div>
    </div>

    <div class="card">
        <div class="preview-box" onclick="document.getElementById('upload').click()">
            <div class="upload-placeholder" id="placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                <span>Click to Upload Image</span>
                <span style="font-size: 11px; font-weight: normal;">(Max 20MB, JPG/PNG/WEBP)</span>
            </div>
            <img id="preview" src="">
            <canvas id="canvas" style="display:none;"></canvas>
        </div>
        <input type="file" id="upload" class="file-input" accept="image/*" onchange="loadImage(event)">

        <div class="info-row" id="info-row">
            <span class="info-original" id="size-info">Size: 0 KB</span>
            <span class="info-estimated" id="new-size" style="display: none;">Est: 0 KB</span>
        </div>

        <!-- COMPRESS CONTROLS -->
        <div id="controls-compressor" class="controls-section">
            <div class="tool-group">
                <div class="tool-header">
                    <span>Export Format</span>
                </div>
                <select id="exportFormat" onchange="updateEstSize()">
                    <option value="image/jpeg">JPG (Standard)</option>
                    <option value="image/webp">WEBP (Best Compression)</option>
                    <option value="image/png">PNG (Lossless - Large)</option>
                </select>
            </div>
            <div class="tool-group">
                <div class="tool-header">
                    <span>Quality</span>
                    <span id="quality-val" style="color: var(--primary);">70%</span>
                </div>
                <input type="range" id="quality" min="0.1" max="1.0" step="0.05" value="0.7" oninput="updateEstSize()">
            </div>
        </div>

        <!-- EDIT CONTROLS -->
        <div id="controls-edit" class="controls-section">
            <div class="tool-group">
                <div class="tool-header"><span>Filters</span></div>
                <div class="filter-grid">
                    <button class="filter-btn active" onclick="applyFilter('none', this)">Normal</button>
                    <button class="filter-btn" onclick="applyFilter('grayscale(100%)', this)">B & W</button>
                    <button class="filter-btn" onclick="applyFilter('sepia(100%)', this)">Sepia</button>
                </div>
            </div>
            <div class="tool-group">
                <button class="filter-btn" style="width: 100%; border-color: var(--primary); color: var(--primary);" onclick="rotateImage()">
                    Rotate 90°
                </button>
            </div>
        </div>

        <!-- PASSPORT CONTROLS -->
        <div id="controls-passport" class="controls-section">
            <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 20px;">
                Image will be automatically cropped and centered to standard 3.5 x 4.5 cm proportion.
            </p>
        </div>

        <button class="btn" id="action-btn" onclick="processAndDownload()" disabled>
            <div class="spinner" id="btn-spinner"></div>
            <svg id="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            <span id="btn-text">SAVE TO DEVICE</span>
        </button>
    </div>

    <script>
        let currentMode = 'compressor';
        let imgElement = document.getElementById('preview');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        
        // State Variables
        let originalFile = null;
        let objectUrl = null;
        let currentRotation = 0;
        let currentFilter = 'none';

        const MAX_DIMENSION = 1920;

        function switchTab(mode) {
            currentMode = mode;
            
            // UI Tab Switching
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + mode).classList.add('active');

            // Controls Switching
            document.querySelectorAll('.controls-section').forEach(c => c.style.display = 'none');
            
            if (originalFile) {
                document.getElementById('controls-' + mode).style.display = 'block';
                if(mode === 'compressor') {
                    document.getElementById('new-size').style.display = 'block';
                    updateEstSize();
                } else {
                    document.getElementById('new-size').style.display = 'none';
                }
            }
        }

        // Web Native File Loading
        function loadImage(event) {
            let file = event.target.files[0];
            if (!file) return;
            originalFile = file;

            if (objectUrl) URL.revokeObjectURL(objectUrl);
            
            objectUrl = URL.createObjectURL(file);
            imgElement.src = objectUrl;
            
            document.getElementById('placeholder').style.display = 'none';
            imgElement.style.display = 'block';
            document.getElementById('resetBtn').style.display = 'block';
            document.getElementById('action-btn').disabled = false;
            document.getElementById('info-row').style.display = 'flex';

            let mbSize = (file.size / (1024 * 1024)).toFixed(2);
            let kbSize = (file.size / 1024).toFixed(0);
            document.getElementById('size-info').innerText = `Orig: ${mbSize > 1 ? mbSize + ' MB' : kbSize + ' KB'}`;

            // Reset edits
            currentRotation = 0;
            currentFilter = 'none';
            applyVisuals();
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.filter-btn').classList.add('active'); // Set 'Normal' active

            imgElement.onload = () => {
                document.getElementById('controls-' + currentMode).style.display = 'block';
                if(currentMode === 'compressor') {
                    document.getElementById('new-size').style.display = 'block';
                    updateEstSize();
                }
            }
        }

        // --- Editing Features ---
        function applyFilter(filterString, btnElement) {
            currentFilter = filterString;
            applyVisuals();
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function rotateImage() {
            currentRotation = (currentRotation + 90) % 360;
            applyVisuals();
        }

        function applyVisuals() {
            imgElement.style.transform = `rotate(${currentRotation}deg)`;
            imgElement.style.filter = currentFilter !== 'none' ? currentFilter : '';
        }

        // --- Compression Logic ---
        function getSafeDimensions(width, height) {
            if (width > height) {
                if (width > MAX_DIMENSION) {
                    height = Math.round(height *= MAX_DIMENSION / width);
                    width = MAX_DIMENSION;
                }
            } else {
                if (height > MAX_DIMENSION) {
                    width = Math.round(width *= MAX_DIMENSION / height);
                    height = MAX_DIMENSION;
                }
            }
            return { width, height };
        }

        function updateEstSize() {
            if(!originalFile || !imgElement.complete) return;
            let q = parseFloat(document.getElementById('quality').value);
            let format = document.getElementById('exportFormat').value;
            
            document.getElementById('quality-val').innerText = Math.round(q * 100) + "%";

            // Very rough estimation formula
            let baseSize = originalFile.size;
            let estSize = baseSize;
            
            if(format === 'image/jpeg') estSize = baseSize * q * 0.8;
            if(format === 'image/webp') estSize = baseSize * q * 0.6;
            if(format === 'image/png') estSize = baseSize * 1.5; // PNG is usually larger

            let kb = Math.round(estSize / 1024);
            document.getElementById('new-size').innerText = "Est: ~" + kb + " KB";
        }

        // --- Core Processing ---
        function processAndDownload() {
            if(!originalFile || !imgElement.complete) return;

            let btn = document.getElementById('action-btn');
            document.getElementById('btn-icon').style.display = 'none';
            document.getElementById('btn-spinner').style.display = 'block';
            document.getElementById('btn-text').innerText = 'PROCESSING...';
            btn.disabled = true;

            setTimeout(() => {
                try {
                    let finalDataUrl = "";
                    let format = currentMode === 'compressor' ? document.getElementById('exportFormat').value : 'image/jpeg';
                    let ext = format.split('/')[1];

                    // Determine Canvas Size considering rotation
                    let dims = getSafeDimensions(imgElement.naturalWidth, imgElement.naturalHeight);
                    let targetWidth = dims.width;
                    let targetHeight = dims.height;

                    if(currentMode === 'passport') {
                        targetWidth = 350;
                        targetHeight = 450;
                    } else if (currentRotation === 90 || currentRotation === 270) {
                        targetWidth = dims.height;
                        targetHeight = dims.width;
                    }

                    canvas.width = targetWidth;
                    canvas.height = targetHeight;
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // Handle Background for transparent images moving to JPG
                    if(format === 'image/jpeg') {
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    // Apply Filters to context
                    if (currentFilter !== 'none') {
                        ctx.filter = currentFilter;
                    } else {
                        ctx.filter = 'none';
                    }

                    // Handle Rotation & Drawing
                    ctx.save();
                    
                    if(currentMode === 'passport') {
                        let srcRatio = imgElement.naturalWidth / imgElement.naturalHeight;
                        let dstRatio = targetWidth / targetHeight;
                        let sx = 0, sy = 0, sWidth = imgElement.naturalWidth, sHeight = imgElement.naturalHeight;

                        if (srcRatio > dstRatio) {
                            sWidth = sHeight * dstRatio;
                            sx = (imgElement.naturalWidth - sWidth) / 2;
                        } else {
                            sHeight = sWidth / dstRatio;
                            sy = (imgElement.naturalHeight - sHeight) / 2;
                        }
                        ctx.drawImage(imgElement, sx, sy, sWidth, sHeight, 0, 0, targetWidth, targetHeight);
                    } 
                    else {
                        // Translate and Rotate for Edit/Compress Mode
                        ctx.translate(canvas.width / 2, canvas.height / 2);
                        ctx.rotate(currentRotation * Math.PI / 180);
                        ctx.drawImage(imgElement, -dims.width / 2, -dims.height / 2, dims.width, dims.height);
                    }
                    
                    ctx.restore();

                    // Export
                    let quality = currentMode === 'compressor' ? parseFloat(document.getElementById('quality').value) : 1.0;
                    finalDataUrl = canvas.toDataURL(format, quality);

                    // Web Download Logic
                    let link = document.createElement('a');
                    link.download = `StudioPro_${Date.now()}.${ext}`;
                    link.href = finalDataUrl;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    // Success State
                    document.getElementById('btn-spinner').style.display = 'none';
                    document.getElementById('btn-icon').style.display = 'block';
                    document.getElementById('btn-icon').innerHTML = `<polyline points="20 6 9 17 4 12"></polyline>`;
                    document.getElementById('btn-text').innerText = 'DOWNLOADED SUCCESSFULLY';
                    btn.classList.add('success');

                    setTimeout(() => {
                        btn.classList.remove('success');
                        btn.disabled = false;
                        document.getElementById('btn-icon').innerHTML = `<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>`;
                        document.getElementById('btn-text').innerText = 'SAVE TO DEVICE';
                    }, 2500);

                } catch(err) {
                    alert("Processing Error. Image might be too large or corrupted.");
                    document.getElementById('btn-spinner').style.display = 'none';
                    document.getElementById('btn-icon').style.display = 'block';
                    document.getElementById('btn-text').innerText = 'SAVE TO DEVICE';
                    btn.disabled = false;
                }
            }, 150);
        }

        function resetStudio() {
            originalFile = null;
            if (objectUrl) URL.revokeObjectURL(objectUrl);
            imgElement.src = '';
            imgElement.style.display = 'none';
            document.getElementById('placeholder').style.display = 'flex';
            document.getElementById('action-btn').disabled = true;
            document.getElementById('resetBtn').style.display = 'none';
            document.querySelectorAll('.controls-section').forEach(c => c.style.display = 'none');
            document.getElementById('info-row').style.display = 'none';
            document.getElementById('upload').value = '';
        }
    </script>
</body>
</html>
